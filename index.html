<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素数学大冒险</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <div id="start-screen" class="pixel-panel">
        <h1 class="game-title">像素数学大冒险</h1>
        <p class="game-subtitle">PIXEL MATH ADVENTURE</p>
        <button id="start-btn" class="pixel-btn">开始游戏</button>
    </div>

    <div id="game-scene" class="pixel-panel">
        <div id="game-content">
            <canvas id="game-canvas" width="800" height="600"></canvas>
        </div>
        <div id="hotbar">
            <div class="hotbar-slot" data-slot="0"><span class="slot-key">1</span><span class="slot-item"></span><span class="slot-count"></span></div>
            <div class="hotbar-slot" data-slot="1"><span class="slot-key">2</span><span class="slot-item"></span><span class="slot-count"></span></div>
            <div class="hotbar-slot" data-slot="2"><span class="slot-key">3</span><span class="slot-item"></span><span class="slot-count"></span></div>
            <div class="hotbar-slot" data-slot="3"><span class="slot-key">4</span><span class="slot-item"></span><span class="slot-count"></span></div>
            <div class="hotbar-slot" data-slot="4"><span class="slot-key">5</span><span class="slot-item"></span><span class="slot-count"></span></div>
            <div class="hotbar-slot" data-slot="5"><span class="slot-key">6</span><span class="slot-item"></span><span class="slot-count"></span></div>
            <div class="hotbar-slot" data-slot="6"><span class="slot-key">7</span><span class="slot-item"></span><span class="slot-count"></span></div>
            <div class="hotbar-slot" data-slot="7"><span class="slot-key">8</span><span class="slot-item"></span><span class="slot-count"></span></div>
            <div class="hotbar-slot" data-slot="8"><span class="slot-key">9</span><span class="slot-item"></span><span class="slot-count"></span></div>
            <div class="hotbar-slot" data-slot="9"><span class="slot-key">0</span><span class="slot-item"></span><span class="slot-count"></span></div>
        </div>
    </div>

    <script src="js/game.js?v=3"></script>
</body>
</html>
